  .sub { font-size: 12px; fill: #6b7280; }
  .lb { font-size: 12px; fill: #1f2937; }
  .sm { font-size: 11px; fill: #6b7280; }
  .b { font-weight: 600; }
  .ink { fill: none; stroke: #1f2937; stroke-width: 1.5; }
  .pipe { fill: none; stroke: #1f2937; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .pipein { fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .green { fill: #2e7d32; }
  .amber { fill: #b45309; }
  .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
  .boxg { fill: #f0fdf4; stroke: #2e7d32; stroke-width: 1.5; }
  .boxa { fill: #fff7ed; stroke: #b45309; stroke-width: 1.5; }
  .boxn { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.2; }
</style>
