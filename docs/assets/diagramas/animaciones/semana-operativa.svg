<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="500" viewBox="0 0 900 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
<title>Semana operativa tipo — animación</title>
<desc>Calendario animado de lunes a domingo de un huerto en Fase 1–2: siembras lunes y jueves, cosecha y ruta de reparto martes y viernes, 10 minutos diarios del lazo L1, recordatorio de cobro y confirmación de pedidos el lunes, corte de factura el viernes, fresh sheet el domingo a las 18:00, calibración quincenal de sondas, simulacro mensual de apagón, y el domingo la revisión semanal: KPIs L2, exportación de CSV, informe del agente L3 y aprobación humana del plan de siembra. Fuente: docs/referencia/06-validacion-y-lazos-agenticos.md, 00-plan-maestro.md, 03-instalacion.md y research/cobranza-b2b.md.</desc>
<style>
