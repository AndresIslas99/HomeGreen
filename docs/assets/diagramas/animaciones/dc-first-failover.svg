<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="500" viewBox="0 0 900 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
<title>DC-first: qué pasa cuando CFE se corta — animación</title>
<desc>Animación del bus DC-first de Fase 2: CFE 127 V, breaker GFCI, cargador LiFePO4 en flotación, batería 12.8 V 100 Ah siempre en paralelo, fusiblera, bomba NFT de 12 V por contacto K1 normalmente cerrado y nodo ESP32 siempre vivo. Secuencia: operación normal, corte de CFE, la bomba sigue desde batería sin conmutación, el voltaje baja lentamente, alerta al teléfono a los 30 s, modo ahorro 15/15 al bajar de 12.9 V, regreso de CFE con notificación de duración del corte. Fuente: docs/research/electrico-respaldo-seguridad.md §2.4 y §5, docs/referencia/03-instalacion.md §2.3.</desc>
