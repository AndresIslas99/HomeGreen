<text x="40" y="438" class="sm">tiempo (ciclo de 24 s ≈ 30 h reales; el corte real típico dura 1–8 h)</text>
<rect x="30" y="200" width="330" height="0" fill="none"/>
<text x="30" y="215" class="lb b">Reglas que hacen que esto funcione</text>
<text x="30" y="233" class="sm">1. La batería está SIEMPRE en paralelo: cero conmutación, cero inversor.</text>
<text x="30" y="249" class="sm">2. K1 por contacto NC + restore_mode RESTORE_DEFAULT_ON: sin ESP32,</text>
<text x="30" y="265" class="sm">   sin Wi-Fi y sin Home Assistant, la bomba sigue.</text>
<text x="30" y="281" class="sm">3. Bomba de 12 V 40 W: 100 Ah × 0.9 × 12.8 V ÷ 40 W ≈ 28–30 h.</text>
<text x="30" y="297" class="sm">4. HA solo avisa (30 s tras el corte) y optimiza (modo ahorro).</text>
<text x="30" y="313" class="sm">5. Router + cerebro en UPS DataShield: sin internet no hay alertas.</text>
<text x="30" y="329" class="sm">6. Se prueba cada mes botando el breaker 10 min (V11).</text>
<rect x="30" y="352" width="7" height="7" fill="#2e7d32"/><text x="42" y="359" class="sm">energía desde CFE</text>
<rect x="160" y="352" width="7" height="7" fill="#b45309"/><text x="172" y="359" class="sm">energía desde batería / alerta</text>
<text x="30" y="380" class="sm">Detector de red: cargador USB 5 V → optoacoplador PC817 → GPIO23 (GND aislado).</text>
<text x="30" y="396" class="sm">Voltaje: divisor 47 kΩ / 10 kΩ → GPIO36, attenuation 12 dB, multiply 5.7.</text>
