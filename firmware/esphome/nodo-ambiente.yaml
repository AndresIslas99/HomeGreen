# =============================================================================
#  HomeGreen · firmware/esphome/nodo-ambiente.yaml
#  Nodo de ambiente (opcional, Fase 1+) · ESP32 DevKit V1 30 pines · ESPHome >= 2025.1
#
#  Para qué sirve: el SHT31 del nodo de riego vive en el gabinete IP65 del poste
#  sureste y el I2C no aguanta más de 1–2 m de cable (docs/diseno/electrico.md,
#  tabla de cableado). Si quieres medir el ambiente a la altura de las charolas
#  a media longitud del túnel, en la zona de germinación o dentro de casa
#  (invierno), este nodo pone el SEGUNDO SHT31 del BOM (bom/fase1.csv: SHT31 ×2)
#  donde haga falta, con su propio ESP32 y un cargador USB de 5 V.
#  Usa el tercer ESP32 de bom/fase1.csv ("2 nodos + 1 repuesto")
#  [POR VERIFICAR: si lo montas, compra otro ESP32 de repuesto, ~$130 aprox. en UNIT].
#
#  Qué hace:
#    · Temperatura y HR (SHT31), punto de rocío y VPD calculados.
#    · Alarmas locales: HR alta, riesgo de helada, T alta (HA las escala).
#    · Opcional: un DS18B20 extra (tapete térmico, agua de remojo) y un LED de estado.
#    · Heartbeat (uptime, estado, señal Wi-Fi).
#  No tiene actuadores: es solo ojos. Si lo pones cerca del nodo de riego, el
#  ventilador se sigue decidiendo con el SHT31 del nodo de riego (o, desde HA,
#  con el promedio de los dos).
#
#  Tabla de pines:
#    GPIO21  SDA   SHT31 (0x44; 0x45 si el módulo tiene el puente ADDR cerrado)
#    GPIO22  SCL   SHT31
#    GPIO4   1-Wire DS18B20 opcional (pull-up 4.7 kΩ)
#    GPIO16  LED de estado opcional (con resistencia de 330 Ω a GND)
#  Alimentación: 5 V por USB (cargador de celular) → nunca USB y VIN a la vez.
# =============================================================================

substitutions:
  nodo: nodo-ambiente
  lugar: "tunel"          # sufijo de las entidades: "tunel", "germinacion", "casa"…

esphome:
  name: ${nodo}
  comment: "HomeGreen · T/HR de ambiente en un segundo punto (SHT31), punto de rocío y VPD"
  min_version: "2025.1.0"
  project:
    name: "homegreen.nodo_ambiente"
    version: "1.0.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${nodo} rescate"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key_ambiente
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO
  baud_rate: 115200

web_server:
  port: 80
  version: 3

time:
  - platform: homeassistant
    id: ha_time

preferences:
  flash_write_interval: 5min

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz

one_wire:
  - platform: gpio
    id: ow_extra
    pin: GPIO4                # pull-up 4.7 kΩ entre DQ y 3V3

# LED de estado opcional (parpadea sin Wi-Fi/API; fijo con error). Descomenta
# si soldaste un LED a GPIO16; el LED azul integrado va en GPIO2 (pin de
# arranque) y por convención del proyecto no se usa.
# status_led:
#   pin: GPIO16

# --- Umbrales de alarma (editables desde HA) ---------------------------------
number:
  - platform: template
    name: "Ambiente ${lugar} HR alta umbral"
    id: hr_alta_umbral
    min_value: 40
    max_value: 95
    step: 1
    initial_value: 75      # 06 §L0: HR < 75 %
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    icon: mdi:water-percent-alert
  - platform: template
    name: "Ambiente ${lugar} T alta umbral"
    id: t_alta_umbral
    min_value: 20
    max_value: 40
    step: 0.5
    initial_value: 28      # 06 §L0: T < 28 °C
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    icon: mdi:thermometer-high
  - platform: template
    name: "Ambiente ${lugar} helada umbral"
    id: t_helada_umbral
    min_value: -5
    max_value: 15
    step: 0.5
    initial_value: 6       # 02-restricciones: alarma < 6 °C (sur de CDMX, dic–feb)
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
    icon: mdi:snowflake-alert

sensor:
  # --- SHT31 -------------------------------------------------------------------
  - platform: sht3xd
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Temperatura ${lugar}"
      id: t_amb
      accuracy_decimals: 1
      filters:
        - filter_out: nan
    humidity:
      name: "Humedad ${lugar}"
      id: hr_amb
      accuracy_decimals: 0
      filters:
        - filter_out: nan

  # Punto de rocío (Magnus): condensación en plástico/charolas si la superficie
  # está más fría que este valor → moho.
  - platform: template
    name: "Punto de rocio ${lugar}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    icon: mdi:water-thermometer
    lambda: |-
      const float t = id(t_amb).state, hr = id(hr_amb).state;
      if (std::isnan(t) || std::isnan(hr) || hr <= 0.0f) return {};
      const float a = 17.62f, b = 243.12f;
      const float g = logf(hr / 100.0f) + a * t / (b + t);
      return b * g / (a - g);

  # Déficit de presión de vapor (Tetens), en kPa: cuánta "sed" tiene el aire.
  # Dato para el agente L3 (relación con estiramiento y transpiración).
  - platform: template
    name: "VPD ${lugar}"
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    icon: mdi:air-filter
    lambda: |-
      const float t = id(t_amb).state, hr = id(hr_amb).state;
      if (std::isnan(t) || std::isnan(hr)) return {};
      const float es = 0.6108f * expf(17.27f * t / (t + 237.3f));   // presión de saturación, kPa
      return es * (1.0f - hr / 100.0f);

  # --- DS18B20 opcional (descomenta si lo conectas a GPIO4) --------------------
  # - platform: dallas_temp
  #   one_wire_id: ow_extra
  #   name: "Temperatura extra ${lugar}"
  #   resolution: 12
  #   update_interval: 60s
  #   accuracy_decimals: 1

  # --- Heartbeat ---------------------------------------------------------------
  - platform: uptime
    name: "Nodo ambiente uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Nodo ambiente senal WiFi"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Nodo ambiente estado"
  - platform: template
    name: "HR alta ${lugar}"
    device_class: moisture
    lambda: |-
      if (std::isnan(id(hr_amb).state)) return false;
      return id(hr_amb).state > id(hr_alta_umbral).state;
  - platform: template
    name: "T alta ${lugar}"
    device_class: heat
    lambda: |-
      if (std::isnan(id(t_amb).state)) return false;
      return id(t_amb).state > id(t_alta_umbral).state;
  - platform: template
    name: "Riesgo de helada ${lugar}"
    device_class: cold
    lambda: |-
      if (std::isnan(id(t_amb).state)) return false;
      return id(t_amb).state < id(t_helada_umbral).state;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Nodo ambiente IP"
      entity_category: diagnostic
  - platform: version
    name: "Nodo ambiente version ESPHome"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Nodo ambiente reiniciar"
    entity_category: diagnostic
