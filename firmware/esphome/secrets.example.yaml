# =============================================================================
#  HomeGreen · firmware/esphome/secrets.example.yaml
#
#  Cómo usarlo:
#    1. Copia este archivo a  firmware/esphome/secrets.yaml  (mismo directorio
#       que los nodo-*.yaml; ESPHome busca "secrets.yaml" junto al YAML).
#    2. Llena tus valores. NUNCA subas secrets.yaml al repositorio: ya está en
#       el .gitignore, y si lo ves aparecer en un "git status", algo se rompió.
#    3. Si usas el add-on de ESPHome en Home Assistant, el mismo contenido va en
#       su archivo "secrets.yaml" (menú ⋮ → Secrets editor).
#
#  Cómo generar claves:
#    · api_key_*   : 32 bytes en base64. En una terminal:  openssl rand -base64 32
#                    (o el botón "Generate" del add-on de ESPHome). Una por nodo.
#    · ota_password: cualquier frase larga; la misma para los tres nodos está bien.
#    · ap_password : mínimo 8 caracteres; es la red de rescate que levanta cada
#                    nodo si no encuentra tu Wi-Fi.
# =============================================================================

# --- Wi-Fi del patio (el ESP32 SOLO se conecta a redes de 2.4 GHz) ------------
wifi_ssid: "MiRedWiFi-2.4GHz"
wifi_password: "cambia-esta-clave"

# --- Red de rescate (AP propio de cada nodo) --------------------------------------
ap_password: "huerto-rescate"

# --- Clave de cifrado de la API nativa de Home Assistant (una por nodo) -----------
api_key_riego: "GENERA_32_BYTES_EN_BASE64_CON_openssl_rand_-base64_32="
api_key_ambiente: "GENERA_OTRA_CLAVE_DISTINTA_PARA_ESTE_NODO=================="
api_key_nft: "Y_OTRA_MAS_PARA_EL_NODO_NFT================================="

# --- Contraseña de actualización OTA (la piden esphome run / el add-on) ------------
ota_password: "cambia-esta-clave-ota"
