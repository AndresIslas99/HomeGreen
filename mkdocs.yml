site_name: HomeGreen — Huerto comercial automatizado CDMX
site_description: Guía-brújula para construir y operar un huerto comercial de microgreens y hierbas NFT en un patio de 80 m² en la Ciudad de México, automatizado con ESP32 + ESPHome + Home Assistant.
site_url: https://andresislas99.github.io/HomeGreen/
repo_url: https://github.com/AndresIslas99/HomeGreen
repo_name: AndresIslas99/HomeGreen
edit_uri: edit/main/docs/
copyright: HomeGreen · documentación viva del proyecto

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/css/extra.css
  - assets/css/seguimiento.css

extra_javascript:
  - assets/js/seguimiento.js

# Con --strict, cualquiera de estos avisos rompe el build: un enlace interno roto,
# un ancla que no existe, una página fuera del nav o un enlace absoluto que debería ser
# relativo. Es lo que revisa .github/workflows/docs.yml en cada pull request.
# Los *.notas.md son fragmentos, no páginas: se incrustan con pymdownx.snippets. Sin esta
# exclusión, `omitted_files: warn` + --strict rompería el build por estar fuera del nav.
exclude_docs: |
  *.notas.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn

plugins:
  - search:
      lang: es
  # Zoom a pantalla completa de los diagramas: zoomable + draggable permiten
  # acercarse y arrastrar dentro del plano, que es como de verdad se leen las
  # cotas de un patio de 1220 px de ancho.
  - glightbox:
      zoomable: true
      draggable: true
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: none
      width: 96%
      height: auto
      # Los alt de este repo son descripciones largas y utiles, no relleno:
      # como pie del visor se aprovechan gratis.
      auto_caption: true
      caption_position: bottom
      background: "#ffffff"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  # La leyenda y las notas clave de cada plano las escribe hardware/cad/layout.py en
  # docs/assets/diagramas/layout/<plano>.notas.md; las páginas las incrustan con `--8<--`
  # para que ese texto se lea a 16 px (dentro del SVG quedaba en 6) y siga teniendo un
  # único origen regenerable.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

